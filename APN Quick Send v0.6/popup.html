<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    
    body { 
      width: 250px; 
      background-color: #0d1117; 
      color: #c9d1d9; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      padding: 15px; 
      margin: 0; 
    }

    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #21262d;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
      
      
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #f0f6fc;
      text-transform: uppercase;
    }

  
    .status-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    
  
    display: flex;
    flex-direction: column; 
    align-items: center;    
    text-align: center;     
}

    .label {
      font-size: 16px;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }

    .info-main {
      font-size: 18px;
      line-height: 1.5;
      color: #c9d1d9;
      margin-bottom: 12px;
    }

   
    .badge-container {
    display: flex;
    justify-content: center; 
    gap: 8px;
    margin-top: 10px;
    }	

    .badge {
  	background: #0d1117;
  	padding: 3px 10px;
 	 border-radius: 12px;
  	border: 1px solid #30363d;
 	 font-size: 15px;
 	 font-weight: 500;

 	
 	 display: flex;
 	 align-items: center; 
 	 justify-content: center; 
 	 gap: 5px; 
	    }
	.active-dot {
 		 color: #3fb950;
 		 font-size: 19px;
	 	 line-height: 0;  
	 	 display: inline-block;
		 transform: translateY(-2px);
	}

    .version-text {
      color: #79c0ff;
    }

    .footer {
      margin-top: 16px;
      font-size: 10px;
      color: #484f58;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .badge-signature {
      display: inline-block;
      padding: 2px 7px;
      font-size: 7px;
      font-weight: 700;
      color: #8b949e; 
      border: 1px solid #30363d; 
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(48, 54, 61, 0.2); 
      margin-top: 5px;
    }

    .badge-signature:hover {
      color: #58a6ff;
      border-color: #58a6ff;
      transition: 0.3s;
    }

  </style>
</head>
<body>

  <div class="header">
    <img src="imagens/logo.png" class="brand-icon" alt="Logo">
    <span class="title">APN Quick Send</span>
  </div>
  
  <div class="status-card">
    <span class="label">Status da Extensão</span>
    <div class="info-main">
     	Pronto para uso.
    </div>

    <div class="badge-container">
      <div class="badge">
        <span class="active-dot">●</span> ONLINE
      </div>
      <div class="badge">
        V <span class="version-text">0.5</span>
      </div>
	
    </div>
    	<div class="footer">
    	<a href="https://teams.microsoft.com/l/chat/0/0?users=wpgoncalves@verointernet.com.br" class="badge-signature" target="_blank">
    Criado por Wallace Gonçalves
</a>   	
    	</p>
    </div>
  </div>


</body>
</html>
